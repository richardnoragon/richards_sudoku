[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "richards-sudoku"
version = "0.1.0"
description = "A Python + PyQt6 Sudoku application supporting multiple variants."
requires-python = ">=3.13"
dependencies = [
    "PyQt6>=6.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
richards-sudoku = "richards_sudoku.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
qt_api = "pyqt6"
markers = [
    "qt: Qt UI tests",
    "slow: slow-running tests",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.13"
files = ["src/richards_sudoku/model"]
ignore_missing_imports = true
warn_unused_ignores = true
pretty = true
